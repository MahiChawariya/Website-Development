<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Admin - Renewals</title>

<style>
body{
    font-family:Arial;
    background:#eef3fb;
    padding:40px;
}

.container{
    background:white;
    width:95%;
    margin:auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

h2{
    text-align:center;
    color:#23408e;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

th{
    background:#23408e;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#23408e;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="container">

<h2>Customer Renewal Requests</h2>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Policy Number</th>
<th>Insurance Type</th>
</tr>


{% for renewal in renewals %}

<tr>

<td>{{renewal[0]}}</td>
<td>{{renewal[1]}}</td>
<td>{{renewal[2]}}</td>
<td>{{renewal[3]}}</td>
<td>{{renewal[4]}}</td>
<td>{{renewal[5]}}</td>

</tr>

{% endfor %}

</table>


<a href="/admin" class="back">Back</a>


</div>

</body>
</html>
