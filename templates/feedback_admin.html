<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Feedback</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3fb;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#1d3d7c;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1d3d7c;
    color:white;
    padding:14px;
}

td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f5f5f5;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#1d3d7c;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>Customer Feedback</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Rating</th>
    <th>Feedback</th>
</tr>

{% for feedback in feedbacks %}

<tr>

<td>{{ feedback[0] }}</td>
<td>{{ feedback[1] }}</td>
<td>{{ feedback[2] }}</td>
<td>{{ feedback[3] }}</td>
<td>{{ feedback[4] }}</td>
<td>{{ feedback[5] }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/admin" class="back-btn">Back</a>

</div>

</body>
</html>
